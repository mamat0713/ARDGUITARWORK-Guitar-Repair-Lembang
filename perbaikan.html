<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - ARD Guitar Workshop</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* PENTING: Ganti 'foto-bengkel.jpg' dengan nama file foto bengkel lu yang diupload ke GitHub */
            background-image: url('bengkel.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #121212; /* Warna cadangan kalau gambar gagal dimuat */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Bikin efek gelap dikit di atas background bengkel biar teks tetep gampang dibaca */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); /* Tingkat kegelapan background 60% */
            z-index: 0;
        }

        .maintenance-card {
            /* Bikin card jadi transparan dan nambahin efek blur ala kaca */
            background-color: rgba(30, 30, 30, 0.5); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 40px 30px;
            text-align: center;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1; /* Pastikan card ada di atas overlay gelap */
            position: relative;
        }
        .icon-tools {
            font-size: 50px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: 1px;
            color: #ffc107;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 30px;
        }
        .btn-wa {
            background-color: #25d366;
            color: white;
            font-weight: bold;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-wa:hover {
            background-color: #20ba5a;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
        }
        .btn-back {
            color: #b0b0b0;
            text-decoration: none;
            display: block;
            margin-top: 25px;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-back:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="maintenance-card">
            <div class="icon-tools">ARD GUITAR WORK</div>
            <!-- <h1>SEDIKIT LAGI GACOR</h1> -->
            <p><strong>HALLO KAK, MAAF YA</strong><br>Sementara ini halaman Layanan dan Produk sedang dalam <strong>maintenance</strong>. Silahkan hubungi admin ya untuk informasi lebih lanjut.</p>
            
            <a href="https://wa.me/6283829101325?text=Halo%20Admin%20ARD%20Guitar%20Workshop,%20saya%20mau%20tanya%20soal%20layanan%20dan%20produk." class="btn btn-wa" target="_blank">
                💬 Hubungi Admin via WhatsApp
            </a>
            
            <a href="index.html" class="btn-back">← Kembali ke Beranda</a>
        </div>
    </div>

</body>
</html>
